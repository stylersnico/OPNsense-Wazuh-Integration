<!--
  Syslog listener for OPNsense.

  Paste this block at the end of /var/ossec/etc/ossec.conf on the Wazuh
  manager (a second <ossec_config> section is fine), replace the IP with the
  address OPNsense sends from, then restart the manager.

  Wazuh takes a single protocol per syslog listener: UDP here, which is the
  OPNsense default. Add one <allowed-ips> line per extra device.
-->
<ossec_config>
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>192.168.1.1</allowed-ips>
  </remote>
</ossec_config>
